{% extends "layout.html" %}

{% block title %}Edit deck{% endblock %}

{% block content %}
<h2>Edit deck details</h2>

<form action="/edit_deck/{{ deck.id }}" method="post">
  <p>
    <label for="name">Deck name:</label> <br />
    <input type="text" name="name" id="name" value="{{ name }}" />
  </p>

  <p>
    <label for="description">Description:</label> <br />
    <textarea name="description" id="description"
              rows="8" cols="60">{{ description }}</textarea>
  </p>
<h3>Tags</h3>
  {% for tag in all_tags %}
    <p>
      <label>
        <input type="checkbox" name="tags" value="{{ tag.id }}"
              {% if tag.id in selected_tag_ids %}checked{% endif %} />
        {{ tag.name }}
      </label>
    </p>
  {% endfor %}

  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Save changes" />
</form>

<p><a href="/deck/{{ deck.id }}">Cancel</a></p>

{% endblock %}
